apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: admission-controller-webhook
webhooks:
  - name: admission-controller.default.svc
    rules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE']
        resources: ['pods']
    clientConfig:
      service:
        name: admission-controller-service
        namespace: default
        path: '/validate'
      caBundle: 
    admissionReviewVersions: ['v1', 'v1beta1']
    sideEffects: None

apiVersion: apps/v1
kind: Deployment
metadata:
  name: admission-controller
  labels:
    app: admission-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admission-controller
  template:
    metadata:
      labels:
        app: admission-controller
    spec:
      containers:
        - name: admission-controller
          image: admission-controller:latest
          ports:
            - containerPort: 8443
